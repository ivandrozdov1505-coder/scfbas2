<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Profit Tracker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;max-width:100%;overflow-x:hidden}
:root{
  --bg:#080b10;--s1:#0e1218;--s2:#131820;--s3:#1a2030;
  --border:#1f2736;--border2:#252e3f;
  --green:#00ffb3;--green2:#00c987;--greendim:rgba(0,255,179,0.08);
  --red:#ff3d6b;--reddim:rgba(255,61,107,0.08);
  --yellow:#ffd84d;--yellowdim:rgba(255,216,77,0.08);
  --blue:#4d9fff;--bluedim:rgba(77,159,255,0.08);
  --purple:#b47aff;--purpledim:rgba(180,122,255,0.08);
  --orange:#ff8c4d;--orangedim:rgba(255,140,77,0.08);
  --text:#dce6f5;--text2:#8a9bb5;--text3:#4a5568;
}
/* ── LIGHT / SEPIA THEME ── */
body.theme-light{
  --bg:#f4ede1;--s1:#fbf5e9;--s2:#f2e8d9;--s3:#e8dac5;
  --border:#d4c3aa;--border2:#bca98d;
  --green:#2f7f5f;--green2:#215742;--greendim:rgba(47,127,95,0.14);
  --red:#ad3f44;--reddim:rgba(173,63,68,0.12);
  --yellow:#9b6f24;--yellowdim:rgba(155,111,36,0.14);
  --blue:#2e5e9c;--bluedim:rgba(46,94,156,0.12);
  --purple:#6c4f8d;--purpledim:rgba(108,79,141,0.12);
  --orange:#a65a2d;--orangedim:rgba(166,90,45,0.12);
  --text:#2f2418;--text2:#6b5540;--text3:#9b846e;
}
body.theme-light::before{background:radial-gradient(ellipse,rgba(166,90,45,0.10) 0%,transparent 72%)}
body.theme-light #topbar{background:rgba(244,237,225,0.96)}
body.theme-light .flash{background:rgba(47,127,95,0.16)}
body.theme-light .btn-ghost{background:var(--s3);color:var(--text2);border-color:var(--border2)}
body.theme-light .btn-ghost:hover{background:var(--border);color:var(--text)}
body.theme-light input[type=text],
body.theme-light input[type=number],
body.theme-light input[type=date],
body.theme-light select,
body.theme-light .notes-area{background:var(--s1);border-color:var(--border2);color:var(--text)}
body.theme-light input::placeholder,
body.theme-light .notes-area::placeholder{color:var(--text3)}
body.theme-light select option{background:var(--s1);color:var(--text)}
body.theme-light .rnum{background:var(--s3);border-color:var(--border)}
body.theme-light .sc{background:var(--s1)}
body.theme-light .sc.blue .sc-val{color:var(--blue)}
body.theme-light .sc.yellow .sc-val{color:var(--yellow)}
body.theme-light .sc.purple .sc-val{color:var(--purple)}
body.theme-light .sc.green .sc-val,body.theme-light .sc.green-state .sc-val{color:var(--green)}
body.theme-light .sc.red .sc-val,body.theme-light .sc.red-state .sc-val{color:var(--red)}
body.theme-light .sc.orange .sc-val{color:var(--orange)}
body.theme-light .mb-p{background:rgba(0,168,118,0.12);color:var(--green)}
body.theme-light .mb-n{background:rgba(224,40,74,0.1);color:var(--red)}
body.theme-light .stock-ok{background:rgba(0,168,118,0.12);color:var(--green)}
body.theme-light .stock-low{background:rgba(196,138,0,0.1);color:var(--yellow)}
body.theme-light .stock-out{background:rgba(224,40,74,0.1);color:var(--red)}
body.theme-light .theme-btn.active{border-color:#2f2418}
body.theme-light .cp-swatch.selected{border-color:#2f2418}
body.theme-light .modal{background:var(--s1)}
body.theme-light .date-chip{background:var(--s3);color:var(--text2)}
body.theme-light .chart-card{background:var(--s1)}
body.theme-light .top-bar-wrap{background:var(--s3)}
body.theme-light .top-rank{background:var(--s3);border-color:var(--border)}
body.theme-light .top-rank.gold{background:rgba(196,138,0,0.15);border-color:rgba(196,138,0,0.3)}
/* ── OCEAN THEME ── */
body.theme-ocean{
  --bg:#040d1a;--s1:#071525;--s2:#0a1c30;--s3:#0d2440;
  --border:#0f2d4a;--border2:#154060;
  --green:#00d4ff;--green2:#00a8cc;--greendim:rgba(0,212,255,0.08);
  --text:#c8e8ff;--text2:#6a9bbf;--text3:#2a4a6a;
}
/* ── PURPLE THEME ── */
body.theme-purple{
  --bg:#0a080f;--s1:#120f1a;--s2:#181424;--s3:#201a2e;
  --border:#2a2040;--border2:#352850;
  --green:#c084fc;--green2:#a855f7;--greendim:rgba(192,132,252,0.08);
  --text:#ede9fe;--text2:#8b7aa8;--text3:#4a3a6a;
}
/* ── FULLSCREEN ── */
body.fullscreen #sidebar{display:none}
body.fullscreen #toggle-sidebar-btn .ic::before{content:'▶'}
/* ── NOTES ── */
.notes-area{width:100%;background:var(--s2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-family:inherit;font-size:12px;padding:9px 12px;outline:none;resize:vertical;min-height:60px;transition:border-color .15s}
.notes-area:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,255,179,0.08)}
.note-chip{display:inline-block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text3);font-style:italic;vertical-align:middle}
/* ── THEME SWITCHER ── */
.theme-btn{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .15s;flex-shrink:0}
.theme-btn:hover,.theme-btn.active{border-color:white;transform:scale(1.2)}
/* ── PERIOD TABS ── */
.period-tabs{display:flex;gap:4px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:4px}
.period-tab{border:none;background:transparent;color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;padding:6px 16px;border-radius:7px;cursor:pointer;transition:all .15s}
.period-tab:hover{color:var(--text2)}
.period-tab.active{background:var(--s1);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.2)}
.period-nav{display:flex;align-items:center;gap:8px}
.period-nav-btn{background:var(--s3);border:1px solid var(--border);border-radius:7px;color:var(--text2);font-family:inherit;font-size:13px;padding:5px 10px;cursor:pointer;transition:all .12s}
.period-nav-btn:hover{background:var(--border);color:var(--text)}
.period-label{font-size:13px;font-weight:700;color:var(--text);min-width:120px;text-align:center}
/* ── CUSTOM CALENDAR ── */
.cal-wrap{position:relative;display:inline-block}
.cal-trigger{background:var(--s2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-family:inherit;font-size:13px;font-weight:500;padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:150px;transition:border-color .15s;user-select:none}
.cal-trigger:hover,.cal-trigger.open{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,255,179,0.08)}
.cal-trigger-icon{color:var(--green);font-size:14px}
.cal-popup{position:fixed;z-index:99999;background:var(--s1);border:1px solid var(--border2);border-radius:14px;padding:16px;width:296px;box-shadow:0 12px 40px rgba(0,0,0,0.6);display:none}
.cal-popup.open{display:block}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:4px}
.cal-year-nav{display:flex;align-items:center;gap:4px}
.cal-month-label{font-size:13px;font-weight:700;color:var(--text);flex:1;text-align:center}
.cal-year-label{font-size:12px;font-weight:600;color:var(--text2);min-width:36px;text-align:center}
.cal-nav{background:var(--s3);border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:14px;padding:4px 9px;cursor:pointer;transition:all .12s;font-family:inherit;line-height:1;flex-shrink:0}
.cal-nav:hover{background:var(--greendim);color:var(--green);border-color:rgba(0,255,179,0.3)}
.cal-sep{width:1px;height:20px;background:var(--border);margin:0 2px}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-wd{text-align:center;font-size:10px;font-weight:700;color:var(--text3);padding:3px 0;letter-spacing:0.04em}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{text-align:center;font-size:13px;padding:6px 0;border-radius:8px;cursor:pointer;transition:background .1s,color .1s;color:var(--text2);border:1px solid transparent;background:transparent;font-family:inherit}
.cal-day:hover{background:var(--s3);color:var(--text)}
.cal-day.today{color:var(--green);font-weight:700;border-color:rgba(0,255,179,0.3)}
.cal-day.selected{background:var(--green);color:#000;font-weight:700}
.cal-day.selected:hover{background:var(--green2)}
.cal-day.empty{cursor:default;pointer-events:none}
.cal-footer{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.cal-today-btn{background:transparent;border:none;color:var(--green);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px}
.cal-today-btn:hover{background:var(--greendim)}
.cal-clear-btn{background:transparent;border:none;color:var(--text3);font-family:inherit;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:6px}
.cal-clear-btn:hover{color:var(--red)}
/* ── HISTORY TAB SWITCHER ── */
.hist-switcher{display:flex;gap:0;background:var(--s2);border:1px solid var(--border);border-radius:10px;overflow:hidden;width:fit-content}
.hist-sw-btn{border:none;background:transparent;color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;padding:8px 20px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:7px}
.hist-sw-btn:hover{color:var(--text2);background:var(--s3)}
.hist-sw-btn.active{background:var(--s1);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.hist-sw-btn .ct{font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--s3);color:var(--text3)}
.hist-sw-btn.active .ct{background:var(--greendim);color:var(--green)}
/* ══════════════════════════════════════════════════════
   MOBILE ADAPTATION
   ══════════════════════════════════════════════════════ */

/* Mobile bottom nav */
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--s1);border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,6px);backdrop-filter:blur(20px)}
.mob-nav-inner{display:flex;justify-content:space-around;align-items:center}
.mob-nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;border:none;background:transparent;color:var(--text3);font-family:inherit;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;cursor:pointer;border-radius:10px;transition:all .15s;min-width:56px}
.mob-nav-btn .mn-ic{font-size:20px;line-height:1}
.mob-nav-btn.active{color:var(--green)}
.mob-nav-btn.active .mn-ic{filter:drop-shadow(0 0 4px var(--green))}

/* Sidebar overlay on mobile */
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:89;backdrop-filter:blur(2px)}
#sb-overlay.show{display:block}

/* Backup modal */
#backup-modal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);align-items:center;justify-content:center}
#backup-modal.show{display:flex}
.backup-box{background:var(--s1);border:1px solid var(--border2);border-radius:16px;padding:24px;width:420px;max-width:92vw;max-height:80vh;overflow-y:auto}
.backup-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--s2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.backup-item-info{flex:1;min-width:0}
.backup-item-date{font-size:13px;font-weight:600;color:var(--text)}
.backup-item-meta{font-size:11px;color:var(--text3);margin-top:2px}
.backup-auto-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;background:var(--bluedim);color:var(--blue);flex-shrink:0}
.backup-manual-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:20px;background:var(--greendim);color:var(--green);flex-shrink:0}

@media (max-width:1024px) and (pointer:coarse){
  /* Show mobile nav, hide desktop sidebar */
  #mobile-nav{display:block}
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:90;
    transform:translateX(-100%);transition:transform .25s cubic-bezier(0.4,0,0.2,1);
    width:260px;height:100vh
  }
  #sidebar.mob-open{transform:translateX(0)}
  body.fullscreen #sidebar{display:flex}

  /* CRITICAL: content takes full width since sidebar is off-screen */
  #app{display:block;width:100%;max-width:100vw;overflow-x:hidden;position:relative;left:0}
  #content{width:100%;min-width:0;max-width:100vw;overflow-x:hidden;position:relative;left:0;margin:0;transform:none}
  #main{width:100%;max-width:100vw;overflow-x:hidden}

  /* If browser forces desktop viewport (e.g. ~980px), still keep one-column mobile flow */
  #main,.toolbar,.form-wrap,.tw,.hist-form,.hist-list,.stock-card,.chart-card{width:100%;max-width:100%}

  /* Topbar: compact */
  #topbar{padding:0 10px;height:50px;gap:8px}
  .topbar-r{min-width:0;gap:6px}
  .topbar-r > div:first-child{padding:3px 8px;gap:4px;max-width:52vw;overflow-x:auto}
  .topbar-title{font-size:14px}
  .topbar-sub{display:none}
  .topbar-r .btn-ghost{display:none}
  .topbar-r .btn-ghost:last-child{display:none}
  #toggle-sidebar-btn{display:inline-flex!important}
  /* Make toggle button open mobile sidebar */

  /* Main padding */
  #main{padding:12px;gap:12px;padding-bottom:80px}

  /* Stats grid: 2 columns */
  .sg{grid-template-columns:repeat(2,1fr);gap:8px}
  .sc{padding:12px 14px}
  .sc-val{font-size:17px}
  .sc-icon{width:26px;height:26px;font-size:12px;margin-bottom:7px}

  /* Info banner: collapsed by default on mobile */
  .info-banner{padding:10px 12px;gap:8px;cursor:pointer}
  .info-banner-text{display:none}
  .info-banner.mob-expanded .info-banner-text{display:block;font-size:11px}
  .info-banner-title::after{content:' ▼';font-size:9px;color:var(--text3);font-weight:400}
  .info-banner.mob-expanded .info-banner-title::after{content:' ▲'}

  /* Product form: 2-column grid */
  .form-body{
    grid-template-columns:1fr 1fr!important;
    gap:10px;padding:14px!important
  }
  .form-body .fg:first-child{grid-column:1/-1}
  .form-body .fbtns{grid-column:1/-1;flex-direction:row;gap:8px}
  .form-body .fbtns .btn{flex:1;justify-content:center}

  /* History form: 2-column */
  .hist-body{
    grid-template-columns:1fr 1fr!important;
    gap:10px;padding:14px!important
  }
  .hist-body .fg:first-child{grid-column:1/-1}
  .hist-body .fbtns{grid-column:1/-1;padding-top:0!important}
  .hist-body .fbtns .btn{width:100%;justify-content:center}

  /* Tables: horizontal scroll */
  .tw,.hist-list,.stock-card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .thead,.tr,.tfoot{min-width:660px}
  .hist-thead,.hist-tr{min-width:600px}
  .stock-card-head,.stock-row{min-width:560px}
  /* Scroll hint */
  .tw::after,.hist-list::after{content:'← прокрути →';display:block;text-align:center;font-size:10px;color:var(--text3);padding:6px;border-top:1px solid var(--border)}

  /* Analytics */
  .analytics-grid{grid-template-columns:1fr!important}
  .chart-card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .period-tabs{gap:2px}
  .period-tab{padding:5px 10px;font-size:11px}
  .period-nav-btn{padding:5px 8px}

  /* Modals */
  .modal{width:94vw}
  .backup-box{width:94vw}

  /* Misc */
  .folder-pill{max-width:80px}
  .hist-switcher{width:100%}
  .hist-sw-btn{flex:1;justify-content:center;padding:8px 10px}
  ::-webkit-scrollbar{width:0;height:0}

  /* Touch targets */
  .bico{padding:9px 12px;font-size:14px}
  .btn{padding:10px 16px}
  input[type=text],input[type=number],input[type=date],select{
    padding:12px 13px;font-size:16px /* prevents iOS zoom */
  }
  .sb-add-folder{padding:12px 10px}
  .sb-nav-btn{padding:11px 10px}
}

@media (max-width:640px) and (pointer:coarse){
  .sg{grid-template-columns:1fr 1fr}
  .sc-val{font-size:16px}
  .sc{padding:12px 13px}
  #main{padding:10px;gap:12px;padding-bottom:75px}
  .period-tabs{flex-wrap:wrap}
}
.minstock-wrap{display:flex;align-items:center;gap:6px}
.minstock-wrap input{width:55px;padding:4px 8px;font-size:12px;text-align:center}
/* ── INSTRUCTION BANNER ── */
.info-banner{background:var(--s2);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:12px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
.info-banner-icon{font-size:20px;flex-shrink:0}
.info-banner-body{flex:1}
.info-banner-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:5px}
.info-banner-text{font-size:11px;color:var(--text2);line-height:1.7}
.info-banner-text b{color:var(--text);font-weight:600}
.info-banner-close{background:transparent;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 2px;flex-shrink:0;line-height:1;transition:color .12s}
.info-banner-close:hover{color:var(--red)}
/* ── STOCK REDESIGN ── */
.stock-card{background:var(--s1);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.stock-card-head{padding:11px 18px;background:var(--s2);border-bottom:1px solid var(--border);display:grid;gap:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3)}
.stock-row{display:grid;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:center;transition:background .12s}
.stock-row:last-child{border-bottom:none}
.stock-row:hover{background:var(--s2)}
.stock-dual-bar{height:8px;border-radius:4px;overflow:hidden;background:var(--s3);display:flex;margin:5px 0 3px}
.stock-pct-row{display:flex;justify-content:space-between}
.stock-pct{font-size:10px;color:var(--text3)}
@media print{
  #sidebar,#topbar,.toolbar,.fbtns,.bico,#tfoot .bico,button{display:none!important}
  body{background:#fff;color:#000}
  .tw,.sc,.form-wrap{border:1px solid #ccc;box-shadow:none}
  .sc-val{color:#000!important}
  #print-header{display:block!important}
}
#print-header{display:none;text-align:center;padding:16px 0;font-size:18px;font-weight:700;border-bottom:2px solid #000;margin-bottom:20px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:-40vh;left:-20vw;width:70vw;height:70vh;background:radial-gradient(ellipse,rgba(0,200,150,0.03) 0%,transparent 70%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#app{display:flex;min-height:100vh;width:100%;max-width:100%}

/* ── SIDEBAR ── */
#sidebar{width:240px;flex-shrink:0;background:var(--s1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#000;box-shadow:0 0 14px rgba(0,255,179,0.2);flex-shrink:0}
.logo-text{font-size:13px;font-weight:700;color:var(--text)}
.logo-sub{font-size:10px;color:var(--text3);font-weight:500}
.sb-section{padding:14px 14px 6px;font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--text3)}
.sb-nav-btn{margin:0 8px 2px;border-radius:9px;border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:13px;font-weight:500;padding:9px 10px;display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .12s;width:calc(100% - 16px);text-align:left}
.sb-nav-btn:hover{background:var(--s3);color:var(--text)}
.sb-nav-btn.active{background:var(--greendim);color:var(--green)}
.sb-nav-btn .ic{font-size:15px;width:20px;text-align:center}
.sb-nav-btn .ct{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--s3);color:var(--text3)}
.sb-nav-btn.active .ct{background:var(--greendim);color:var(--green)}
.sb-divider{height:1px;background:var(--border);margin:10px 14px}
.folder-item{margin:0 8px 2px;border-radius:9px;display:flex;align-items:center;cursor:pointer;position:relative}
.folder-btn{flex:1;display:flex;align-items:center;gap:9px;padding:9px 10px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-align:left;border-radius:9px;min-width:0;transition:color .12s}
.folder-item:hover .folder-btn{background:var(--s3);color:var(--text)}
.folder-item.active{background:var(--s3)}
.folder-item.active .folder-btn{color:var(--text)}
.folder-color{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.folder-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--s2);color:var(--text3);flex-shrink:0}
.folder-actions{display:none;position:absolute;right:6px;gap:3px;align-items:center;background:var(--s3);border-radius:6px;padding:2px}
.folder-item:hover .folder-actions{display:flex}
.fa-btn{background:transparent;border:none;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:11px;color:var(--text3);transition:all .12s}
.fa-btn:hover.edit{color:var(--green);background:var(--greendim)}
.fa-btn:hover.del{color:var(--red);background:var(--reddim)}
.sb-add-folder{margin:8px 8px 0;padding:9px 10px;border-radius:9px;border:1px dashed var(--border2);background:transparent;color:var(--text3);font-family:inherit;font-size:12px;cursor:pointer;width:calc(100% - 16px);text-align:left;display:flex;align-items:center;gap:8px;transition:all .15s}
.sb-add-folder:hover{border-color:var(--green);color:var(--green);background:var(--greendim)}
.sb-stats{margin-top:auto;padding:14px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)}
.sb-stats-row{display:flex;justify-content:space-between;margin-bottom:5px;font-weight:500}
.sb-stats-row span{color:var(--text2)}
.sb-stats-row span.g{color:var(--green)}
.sb-stats-row span.r{color:var(--red)}

/* ── CONTENT ── */
#content{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1}
#topbar{background:rgba(8,11,16,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40}
.topbar-title{font-size:15px;font-weight:700;color:var(--text)}
.topbar-sub{font-size:11px;color:var(--text3)}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.flash{font-size:11px;color:var(--green);opacity:0;transition:opacity .3s;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--greendim)}
.flash.on{opacity:1}

/* ── BUTTONS ── */
.btn{border:none;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(0.97)}
.btn-ghost{background:var(--s3);color:var(--text2);border:1px solid var(--border2)}
.btn-ghost:hover{background:var(--s2);color:var(--text)}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#000;font-weight:700;box-shadow:0 4px 16px rgba(0,255,179,0.15)}
.btn-primary:hover{box-shadow:0 4px 24px rgba(0,255,179,0.3);transform:translateY(-1px)}
.btn-warn{background:linear-gradient(135deg,var(--yellow),#e6b800);color:#000;font-weight:700}
.btn-warn:hover{transform:translateY(-1px)}
.btn-blue{background:linear-gradient(135deg,var(--blue),#2a7fe0);color:#fff;font-weight:700}
.btn-blue:hover{transform:translateY(-1px)}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,61,107,0.2);font-size:11px;padding:6px 10px}
.btn-danger:hover{background:var(--reddim)}
.bico{background:transparent;border-radius:6px;padding:5px 9px;font-size:13px;cursor:pointer;transition:all .12s;line-height:1;border:1px solid transparent}
.bico-e{color:var(--green);border-color:rgba(0,255,179,0.15)}
.bico-e:hover{background:var(--greendim)}
.bico-d{color:var(--red);border-color:rgba(255,61,107,0.15)}
.bico-d:hover{background:var(--reddim)}

/* ── MAIN ── */
#main{padding:24px 28px;display:flex;flex-direction:column;gap:22px}

/* ── STATS ── */
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sc{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s;cursor:default}
.sc:hover{border-color:var(--border2);transform:translateY(-2px)}
.sc-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:10px}
.sc.blue .sc-icon{background:var(--bluedim)}.sc.yellow .sc-icon{background:var(--yellowdim)}.sc.purple .sc-icon{background:var(--purpledim)}.sc.green .sc-icon{background:var(--greendim)}.sc.red .sc-icon{background:var(--reddim)}.sc.orange .sc-icon{background:var(--orangedim)}
.sc-label{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:5px}
.sc-val{font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1}
.sc.blue .sc-val{color:var(--blue)}.sc.yellow .sc-val{color:var(--yellow)}.sc.purple .sc-val{color:var(--purple)}.sc.green .sc-val,.sc.green-state .sc-val{color:var(--green)}.sc.red .sc-val,.sc.red-state .sc-val{color:var(--red)}.sc.neutral .sc-val{color:var(--text2)}.sc.orange .sc-val{color:var(--orange)}
.sc-sub{font-size:11px;color:var(--text3);margin-top:6px;font-weight:500}
.sc-badge{position:absolute;bottom:14px;right:14px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px}
.sc.green .sc-badge,.sc.green-state .sc-badge{background:var(--greendim);color:var(--green)}
.sc.red .sc-badge,.sc.red-state .sc-badge{background:var(--reddim);color:var(--red)}

/* ── FORM ── */
.form-wrap{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.form-head{padding:13px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.fh-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
.fh-dot.yellow{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}
.fh-title{font-size:13px;font-weight:600;color:var(--text)}
.fh-sub{font-size:11px;color:var(--text3);margin-left:auto}
.form-body{padding:18px 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 120px auto;gap:12px;align-items:end}
.fg{display:flex;flex-direction:column;gap:6px}
.fl{font-size:10px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
input[type=text],input[type=number],input[type=date],select{background:var(--s2);border:1px solid var(--border2);border-radius:9px;color:var(--text);font-family:inherit;font-size:13px;font-weight:500;padding:9px 12px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--text3)}
input:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,255,179,0.08)}
input[type=number]::-webkit-inner-spin-button{opacity:0.3}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.5) sepia(1) hue-rotate(120deg)}
select option{background:var(--s2)}
.fbtns{display:flex;flex-direction:column;gap:8px}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px}
.search-wrap{position:relative;flex:1;max-width:300px}
.search-wrap input{padding-left:34px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.sort-info{font-size:11px;color:var(--text3);font-weight:500}

/* ── TABLE ── */
.tw{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.thead{display:grid;padding:10px 18px;gap:10px;background:var(--s2);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase;align-items:center}
.thead-cell{cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px;transition:color .12s}
.thead-cell:hover{color:var(--text2)}
.thead-cell.sorted{color:var(--green)}
.sort-arrow{font-size:9px;opacity:0.5}
.sort-arrow.on{opacity:1;color:var(--green)}
.tr{display:grid;padding:12px 18px;gap:10px;border-bottom:1px solid var(--border);font-size:13px;align-items:center;border-left:3px solid transparent;transition:background .12s}
.tr:last-child{border-bottom:none}
.tr:hover{background:var(--s2) !important}
.tr.even{background:rgba(19,24,32,0.5)}
.tr.editing{background:rgba(255,216,77,0.04) !important;border-left-color:var(--yellow) !important}
.tfoot{display:grid;padding:12px 18px;gap:10px;background:var(--s2);font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;align-items:center;border-top:1px solid var(--border)}
/* Products table: # name folder wholesale retail qty expenses profit stock notes actions */
.tgrid-p{grid-template-columns:28px 1.6fr 90px 1fr 1fr 1fr 1fr 1.1fr 70px 1fr 80px}
.empty{padding:52px 24px;text-align:center}
.empty-icon{font-size:34px;margin-bottom:12px;opacity:0.15}
.empty-text{font-size:13px;color:var(--text3);font-weight:500}
.rnum{width:26px;height:26px;border-radius:7px;background:var(--s3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text3)}
.rname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcell{color:var(--text2);font-weight:500;font-size:13px}
.folder-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;max-width:100%;overflow:hidden}
.fp-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.fp-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcell{display:flex;flex-direction:column;gap:3px;font-weight:700}
.mb{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:700;width:fit-content}
.mb-p{background:var(--greendim);color:var(--green)}
.mb-n{background:var(--reddim);color:var(--red)}

/* ── ANALYTICS ── */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.analytics-grid.full{grid-template-columns:1fr}
.chart-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:20px 22px}
.chart-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
.chart-sub{font-size:11px;color:var(--text3);margin-bottom:18px}
.chart-area{width:100%;overflow:hidden}
.top-list{display:flex;flex-direction:column;gap:10px}
.top-item{display:flex;align-items:center;gap:12px}
.top-rank{width:22px;height:22px;border-radius:6px;background:var(--s3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text3);flex-shrink:0}
.top-rank.gold{background:rgba(255,216,77,0.15);border-color:rgba(255,216,77,0.3);color:var(--yellow)}
.top-name{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-bar-wrap{width:120px;height:6px;background:var(--s3);border-radius:3px;overflow:hidden;flex-shrink:0}
.top-bar{height:100%;border-radius:3px;background:var(--green);transition:width .4s}
.top-val{font-size:12px;font-weight:700;color:var(--green);flex-shrink:0;text-align:right;min-width:80px}

/* ── HISTORY ── */
.hist-form{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.hist-body{padding:18px 20px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end}
.hist-list{background:var(--s1);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.hist-thead{display:grid;grid-template-columns:100px 2fr 1fr 1fr 1fr 1fr 36px;padding:10px 18px;gap:10px;background:var(--s2);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase}
.hist-tr{display:grid;grid-template-columns:100px 2fr 1fr 1fr 1fr 1fr 36px;padding:11px 18px;gap:10px;border-bottom:1px solid var(--border);font-size:13px;align-items:center;transition:background .12s}
.hist-tr:hover{background:var(--s2)}
.hist-tr:last-child{border-bottom:none}
.date-chip{font-size:11px;font-weight:600;color:var(--text3);background:var(--s3);padding:3px 8px;border-radius:6px;white-space:nowrap}

/* ── STOCK ── */
.stock-thead{display:grid;grid-template-columns:28px 2fr 90px 1fr 1fr 160px 80px;padding:10px 18px;gap:10px;background:var(--s2);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase;align-items:center}
.stock-tr{display:grid;grid-template-columns:28px 2fr 90px 1fr 1fr 160px 80px;padding:12px 18px;gap:10px;border-bottom:1px solid var(--border);font-size:13px;align-items:center;transition:background .12s}
.stock-tr:hover{background:var(--s2)}
.stock-tr:last-child{border-bottom:none}
.stock-bar-wrap{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.stock-bar{height:100%;border-radius:3px;transition:width .3s}
.stock-label{font-size:11px;font-weight:700;margin-top:4px}
.stock-input-wrap{display:flex;align-items:center;gap:6px}
.stock-input-wrap input{width:70px;padding:6px 9px;font-size:12px}
.stock-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.stock-ok{background:var(--greendim);color:var(--green)}
.stock-low{background:var(--yellowdim);color:var(--yellow)}
.stock-out{background:var(--reddim);color:var(--red)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.show{opacity:1;pointer-events:all}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:16px;padding:26px;width:380px;max-width:90vw;transform:translateY(10px) scale(0.98);transition:transform .2s}
.modal-overlay.show .modal{transform:none}
.modal-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:22px}
.modal-label{font-size:11px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:7px;display:block}
.color-picker{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.cp-swatch{width:26px;height:26px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cp-swatch.selected{border-color:white;transform:scale(1.15);box-shadow:0 0 10px rgba(255,255,255,0.3)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.footnote{font-size:11px;color:var(--text3);text-align:center;padding:6px 0 24px;font-weight:500}
#imp{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim{animation:fadeIn .2s ease}
</style>
</head>
<body>

<!-- SIDEBAR OVERLAY (mobile) -->
<div id="sb-overlay" onclick="closeMobileSidebar()"></div>

<!-- MOBILE BOTTOM NAV -->
<div id="mobile-nav">
  <div class="mob-nav-inner">
    <button class="mob-nav-btn active" id="mn-products" onclick="switchTab('products');closeMobileSidebar()">
      <span class="mn-ic">🏷️</span>Каталог
    </button>
    <button class="mob-nav-btn" id="mn-analytics" onclick="switchTab('analytics');closeMobileSidebar()">
      <span class="mn-ic">📊</span>Аналитика
    </button>
    <button class="mob-nav-btn" id="mn-history" onclick="switchTab('history');closeMobileSidebar()">
      <span class="mn-ic">🕓</span>История
    </button>
    <button class="mob-nav-btn" id="mn-stock" onclick="switchTab('stock');closeMobileSidebar()">
      <span class="mn-ic">🏪</span>Склад
    </button>
    <button class="mob-nav-btn" id="mn-menu" onclick="toggleMobileSidebar()">
      <span class="mn-ic">☰</span>Меню
    </button>
  </div>
</div>

<!-- BACKUP MODAL -->
<div id="backup-modal">
  <div class="backup-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <div style="font-size:16px;font-weight:700;color:var(--text)">💾 Резервные копии</div>
      <button onclick="closeBackupModal()" style="background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:6px">✕</button>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:18px">Хранится до 10 копий. Авто — каждые 2 часа.</div>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="btn btn-primary" style="flex:1;justify-content:center" onclick="createManualBackup()">＋ Создать сейчас</button>
    </div>
    <div id="backup-list"></div>
  </div>
</div>

<!-- CALENDAR POPUP (persistent, attached to body) -->
<div id="cal-popup-el" class="cal-popup">
  <div class="cal-header">
    <button class="cal-nav" id="cal-py">«</button>
    <button class="cal-nav" id="cal-pm">‹</button>
    <div class="cal-month-label" id="cal-month-label"></div>
    <button class="cal-nav" id="cal-nm">›</button>
    <button class="cal-nav" id="cal-ny">»</button>
  </div>
  <div class="cal-weekdays" id="cal-weekdays"></div>
  <div class="cal-days" id="cal-days"></div>
  <div class="cal-footer">
    <button class="cal-clear-btn" id="cal-clear-btn">Сегодня</button>
    <button class="cal-today-btn" id="cal-pick-today">Выбрать сегодня</button>
  </div>
</div>

<!-- FOLDER MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title">Новая папка</div>
    <div class="modal-sub">Название и цвет категории</div>
    <label class="modal-label">Название</label>
    <input type="text" id="modal-name" placeholder="Например: Электроника" style="margin-bottom:16px">
    <label class="modal-label">Цвет</label>
    <div class="color-picker" id="color-picker"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Отмена</button>
      <button class="btn btn-primary" onclick="saveFolder()">Сохранить</button>
    </div>
  </div>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sb-logo">
      <div class="logo-mark">P</div>
      <div><div class="logo-text">ProfitBox</div><div class="logo-sub">v1.9</div></div>
    </div>

    <div class="sb-section">Навигация</div>
    <button class="sb-nav-btn active" id="nav-products" onclick="switchTab('products')">
      <span class="ic">🏷️</span> Каталог <span class="ct" id="cnt-all">0</span>
    </button>
    <button class="sb-nav-btn" id="nav-analytics" onclick="switchTab('analytics')">
      <span class="ic">📊</span> Аналитика
    </button>
    <button class="sb-nav-btn" id="nav-history" onclick="switchTab('history')">
      <span class="ic">🕓</span> История <span class="ct" id="cnt-hist">0</span>
    </button>
    <button class="sb-nav-btn" id="nav-stock" onclick="switchTab('stock')">
      <span class="ic">🏪</span> Склад
    </button>

    <div class="sb-divider"></div>
    <div class="sb-section">Папки</div>

    <button class="sb-nav-btn" id="btn-all" onclick="selectFolder(null)" style="color:var(--text2)">
      <span class="ic">🗂</span> Все позиции <span class="ct" id="cnt-folder-all">0</span>
    </button>
    <div id="folder-list"></div>
    <button class="sb-add-folder" onclick="openModal(null)">＋ Новая папка</button>

    <div class="sb-stats">
      <div class="sb-stats-row">Выручка <span id="sb-rev">₽0</span></div>
      <div class="sb-stats-row">Расходы <span id="sb-exp">₽0</span></div>
      <div class="sb-stats-row">Прибыль <span id="sb-pro" class="g">₽0</span></div>
      <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
        <button class="btn btn-ghost" style="font-size:11px;justify-content:center;width:100%;color:var(--yellow)" onclick="openDocumentation()">📘 Документация</button>
        <button class="btn btn-ghost" style="font-size:11px;justify-content:center;width:100%" onclick="openBackupModal()">🗄 Резервные копии</button>
        <button class="btn btn-ghost" style="font-size:11px;justify-content:center;width:100%" onclick="doExport()">💾 Сохранить данные</button>
        <button class="btn btn-ghost" style="font-size:11px;justify-content:center;width:100%;color:var(--green)" onclick="doExportExcel()">📊 Экспорт в Excel</button>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="content">
    <div id="print-header">📦 ProfitBox — Отчёт</div>
    <div id="topbar">
      <button class="btn btn-ghost" id="toggle-sidebar-btn" onclick="toggleSidebar()" title="Свернуть меню" style="padding:7px 10px;font-size:13px"><span class="ic">◀</span></button>
      <div>
        <div class="topbar-title" id="page-title">Товары</div>
        <div class="topbar-sub" id="page-sub">Все категории</div>
      </div>
      <div class="topbar-r">
        <!-- THEME SWITCHER -->
        <div style="display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--s3);border-radius:20px;border:1px solid var(--border2)">
          <div class="theme-btn active" id="tbtn-dark"   title="Тёмная"   style="background:#0e1218" onclick="setTheme('dark')"></div>
          <div class="theme-btn"        id="tbtn-light"  title="Сепия"    style="background:#f4ede1;border:1px solid #bca98d" onclick="setTheme('light')"></div>
          <div class="theme-btn"        id="tbtn-ocean"  title="Океан"    style="background:#040d1a" onclick="setTheme('ocean')"></div>
          <div class="theme-btn"        id="tbtn-purple" title="Фиолет"   style="background:#0a080f;border:1px solid #b47aff" onclick="setTheme('purple')"></div>
        </div>
        <div class="flash" id="flash">✓ Сохранено</div>
        <label class="btn btn-ghost" style="cursor:pointer" title="Загрузить данные из JSON-файла">📂 Открыть данные<input type="file" id="imp" accept=".json"></label>
        <button class="btn btn-ghost" onclick="doExport()" title="Сохранить все данные в JSON-файл">💾 Сохранить данные</button>
        <button class="btn btn-ghost" onclick="doExportExcel()" title="Экспорт отчёта в Excel (4 листа)" style="color:var(--green)">📊 Экспорт в Excel</button>
        <button class="btn btn-ghost" onclick="doExportCSV('sales')" title="CSV: продажи">CSV Продажи</button>
        <button class="btn btn-ghost" onclick="doExportCSV('purchases')" title="CSV: поставки">CSV Поставки</button>
        <button class="btn btn-ghost" onclick="doExportCSV('stock')" title="CSV: склад">CSV Склад</button>
        <button class="btn btn-ghost" onclick="openDocumentation()" title="Открыть инструкцию и скачать документацию (.md)" style="color:var(--yellow)">📘 Документация</button>
        <button class="btn btn-ghost" onclick="openBackupModal()" title="Резервные копии" style="color:var(--blue)">🗄 Копии</button>
        <button class="btn btn-ghost" onclick="doPrint()" title="Печать / Сохранить как PDF" style="padding:7px 12px">🖨</button>
      </div>
    </div>
    <div id="main"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
var products=[], folders=[], sales=[], purchases=[];
var editId=null, editFolderId=null;
var nextId=1, nextFolderId=1, nextSaleId=1, nextPurchaseId=1;
var selectedFolder=null;
var currentTab='products';
var historyTab='sales'; // 'sales' | 'purchases'
var searchQuery='';
var sortCol='', sortDir='asc';
var selectedColor='#00ffb3';
var currentTheme='dark';
var PALETTE=['#00ffb3','#4d9fff','#b47aff','#ffd84d','#ff3d6b','#ff9f4d','#4dffd4','#ff4dbd'];
var analyticsPeriod='all';
var analyticsMonth=new Date().getMonth();
var analyticsYear=new Date().getFullYear();
var discountType='currency'; // 'currency' | 'percent'
var quickSellProdId=null;
var analyticsRange={mode:'30d',from:'',to:''}; // today|7d|30d|custom
var historyFilters={productId:'',folderId:'',from:'',to:'',type:'all',sort:'date_desc'};
var stockFilters={folderId:'all',problemOnly:false,groupByFolder:false,sort:'stock_asc'};
var lastDeletedAction=null;

// ══════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════
var $=function(id){return document.getElementById(id)};
var fmt=function(n){return n.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0})};
var fmtD=function(n){return n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})};
var fmtP=function(n){return(n>=0?'+':'')+n.toFixed(1)+'%'};
var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
var productById=function(id){for(var i=0;i<products.length;i++)if(products[i].id===id)return products[i];return null};
var folderById=function(id){for(var i=0;i<folders.length;i++)if(folders[i].id===id)return folders[i];return null};
var clampNum=function(n,min){return isNaN(n)?min:Math.max(min,n)};
var isValidDateStr=function(s){return /^\d{4}-\d{2}-\d{2}$/.test(String(s||''))};
var isoToday=function(){return new Date().toISOString().slice(0,10)};
var parseISO=function(s){if(!isValidDateStr(s))return null;var d=new Date(s+'T00:00:00');return isNaN(d.getTime())?null:d;};
var normalizeDate=function(s){return isValidDateStr(s)?s:isoToday();};
var productArticle=function(p){return String(p.article||'').toLowerCase();};
function defaultStockSortValue(p,key){
  var stock=p.stock||0;
  if(key==='qty')return stock;
  if(key==='wholesale')return p.wholesale||0;
  if(key==='retail')return p.retail||0;
  if(key==='stockWholesale')return stock*(p.wholesale||0);
  if(key==='stockRetail')return stock*(p.retail||0);
  return stock;
}
function getActualProfitForSale(s,p){
  if(typeof s.profitAtSale==='number')return s.profitAtSale;
  return (s.qty*(s.price||0))-(s.qty*((typeof s.costAtSale==='number'?s.costAtSale:(p?p.wholesale:0))));
}
function computeSaleSnapshot(p,qty,basePrice,finalPrice,discountPercent){
  var revenue=qty*finalPrice;
  var costAtSale=Number(p.wholesale)||0;
  var retailAtSale=Number(basePrice)||0;
  var discountAtSale=Number(discountPercent)||0;
  var profitAtSale=revenue-(qty*costAtSale);
  return {costAtSale:costAtSale,retailAtSale:retailAtSale,discountAtSale:discountAtSale,profitAtSale:profitAtSale};
}
function recalcStockFromHistory(){
  var soldMap={}, purchasedMap={};
  sales.forEach(function(s){soldMap[s.productId]=(soldMap[s.productId]||0)+(Number(s.qty)||0);});
  purchases.forEach(function(pu){purchasedMap[pu.productId]=(purchasedMap[pu.productId]||0)+(Number(pu.qty)||0);});
  products.forEach(function(p){
    var current=Number(p.qty)||0;
    var sold=soldMap[p.id]||0;
    p.stock=Math.max(0,current-sold);
  });
}
function migrateData(){
  products.forEach(function(p){
    if(p.stock===undefined)p.stock=Number(p.qty)||0;
    if(p.minStock===undefined)p.minStock=5;
    if(p.notes===undefined)p.notes='';
    if(p.article===undefined)p.article='';
    if(p.image===undefined)p.image='';
    p.qty=clampNum(parseInt(p.qty),0);
    p.stock=clampNum(parseInt(p.stock),0);
    p.minStock=clampNum(parseInt(p.minStock),0);
    p.wholesale=clampNum(parseFloat(p.wholesale),0);
    p.retail=clampNum(parseFloat(p.retail),0);
    p.expenses=clampNum(parseFloat(p.expenses||0),0);
  });
  sales.forEach(function(s){
    var p=productById(s.productId);
    s.date=normalizeDate(s.date);
    s.qty=clampNum(parseInt(s.qty),1);
    s.price=clampNum(parseFloat(s.price),0);
    s.discount=clampNum(parseFloat(s.discount||0),0);
    if(s.note===undefined)s.note='';
    if(s.customer===undefined)s.customer='';
    if(typeof s.costAtSale!=='number')s.costAtSale=p?Number(p.wholesale)||0:0;
    if(typeof s.retailAtSale!=='number')s.retailAtSale=s.price;
    if(typeof s.discountAtSale!=='number')s.discountAtSale=s.discount||0;
    if(typeof s.profitAtSale!=='number')s.profitAtSale=(s.qty*s.price)-(s.qty*s.costAtSale);
  });
  purchases.forEach(function(pu){
    pu.date=normalizeDate(pu.date);
    pu.qty=clampNum(parseInt(pu.qty),1);
    pu.price=clampNum(parseFloat(pu.price),0);
    if(pu.note===undefined)pu.note='';
    if(pu.supplier===undefined)pu.supplier='';
  });
  recalcStockFromHistory();
}
var calcFor=function(list){
  var rev=0,cost=0,exp=0,profit=0;
  for(var i=0;i<list.length;i++){var p=list[i];rev+=p.retail*p.qty;cost+=p.wholesale*p.qty;exp+=p.expenses;profit+=(p.retail-p.wholesale)*p.qty-p.expenses;}
  return{rev:rev,cost:cost,exp:exp,profit:profit};
};
var filteredProducts=function(){
  var list=selectedFolder===null?products:products.filter(function(p){return p.folderId===selectedFolder;});
  if(searchQuery){
    var q=searchQuery.toLowerCase();
    list=list.filter(function(p){
      var f=p.folderId?folderById(p.folderId):null;
      return p.name.toLowerCase().indexOf(q)>=0||productArticle(p).indexOf(q)>=0||(f&&f.name.toLowerCase().indexOf(q)>=0);
    });
  }
  if(sortCol){
    list=list.slice().sort(function(a,b){
      var av,bv;
      if(sortCol==='name'){av=a.name.toLowerCase();bv=b.name.toLowerCase();}
      else if(sortCol==='profit'){av=(a.retail-a.wholesale)*a.qty-a.expenses;bv=(b.retail-b.wholesale)*b.qty-b.expenses;}
      else if(sortCol==='retail'){av=a.retail;bv=b.retail;}
      else if(sortCol==='wholesale'){av=a.wholesale;bv=b.wholesale;}
      else if(sortCol==='qty'){av=a.qty;bv=b.qty;}
      else if(sortCol==='expenses'){av=a.expenses;bv=b.expenses;}
      else{av=0;bv=0;}
      if(av<bv)return sortDir==='asc'?-1:1;
      if(av>bv)return sortDir==='asc'?1:-1;
      return 0;
    });
  }
  return list;
};

// ══════════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════════
function persist(){
  try{localStorage.setItem('ptv5',JSON.stringify({products:products,folders:folders,sales:sales,purchases:purchases,nextId:nextId,nextFolderId:nextFolderId,nextSaleId:nextSaleId,nextPurchaseId:nextPurchaseId,theme:currentTheme,discountType:discountType,analyticsRange:analyticsRange}));}catch(e){}
  var f=$('flash');if(f){f.classList.add('on');setTimeout(function(){f.classList.remove('on');},1500);}
  liveUpdate();
}
function loadData(){
  var raw=null;
  var keys=['ptv5','ptv4','ptv3','ptv2','ptv1'];
  for(var k=0;k<keys.length;k++){try{raw=localStorage.getItem(keys[k]);if(raw)break;}catch(e){}}
  try{
    if(raw){
      var d=JSON.parse(raw);
      if(Array.isArray(d)){products=d;folders=[];sales=[];purchases=[];}
      else{products=d.products||[];folders=d.folders||[];sales=d.sales||[];purchases=d.purchases||[];nextId=d.nextId||products.length+1;nextFolderId=d.nextFolderId||folders.length+1;nextSaleId=d.nextSaleId||sales.length+1;nextPurchaseId=d.nextPurchaseId||purchases.length+1;if(d.theme)currentTheme=d.theme;if(d.discountType)discountType=d.discountType;if(d.analyticsRange)analyticsRange=d.analyticsRange;}
    }
  }catch(e){}
  migrateData();
  try{localStorage.setItem('ptv5',JSON.stringify({products:products,folders:folders,sales:sales,purchases:purchases,nextId:nextId,nextFolderId:nextFolderId,nextSaleId:nextSaleId,nextPurchaseId:nextPurchaseId,theme:currentTheme,discountType:discountType,analyticsRange:analyticsRange}));}catch(e){}
}

// ══════════════════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════════════════
function switchTab(tab){
  currentTab=tab;
  ['products','analytics','history','stock'].forEach(function(t){
    var btn=$('nav-'+t);
    if(btn)btn.className='sb-nav-btn'+(t===tab?' active':'');
  });
  render();
}

function selectFolder(id){
  selectedFolder=id;
  if(currentTab!=='products')switchTab('products');
  else render();
}

// ══════════════════════════════════════════════════════
// SIDEBAR RENDER
// ══════════════════════════════════════════════════════
function renderSidebar(){
  var all=calcFor(products);
  $('cnt-all').textContent=products.length;
  $('cnt-folder-all').textContent=products.length;
  $('cnt-hist').textContent=sales.length+purchases.length;
  $('sb-rev').textContent='₽'+fmt(all.rev);
  $('sb-exp').textContent='₽'+fmt(all.exp);
  var sp=$('sb-pro');sp.textContent=(all.profit>=0?'+':'-')+'₽'+fmt(Math.abs(all.profit));sp.className=all.profit>=0?'g':'r';
  var btnAll=$('btn-all');
  btnAll.className='sb-nav-btn'+(selectedFolder===null&&currentTab==='products'?' active':'');

  var fl=$('folder-list');fl.innerHTML='';
  folders.forEach(function(f){
    var cnt=products.filter(function(p){return p.folderId===f.id;}).length;
    var item=document.createElement('div');
    item.className='folder-item'+(selectedFolder===f.id&&currentTab==='products'?' active':'');
    item.innerHTML='<button class="folder-btn" onclick="selectFolder('+f.id+')"><span class="folder-color" style="background:'+f.color+'"></span><span class="folder-name">'+esc(f.name)+'</span><span class="folder-count">'+cnt+'</span></button><div class="folder-actions"><button class="fa-btn edit" onclick="openModal('+f.id+')" title="Переименовать">✎</button><button class="fa-btn del" onclick="deleteFolder('+f.id+')" title="Удалить">✕</button></div>';
    fl.appendChild(item);
  });

  // Sync folder select in form
  var sel=$('fcat');
  if(sel){
    var cur=sel.value;
    sel.innerHTML='<option value="">— Без папки —</option>';
    folders.forEach(function(f){var o=document.createElement('option');o.value=f.id;o.textContent=f.name;sel.appendChild(o);});
    if(cur)try{sel.value=cur;}catch(e){}
    if(selectedFolder!==null&&!editId)sel.value=selectedFolder;
  }
}

// ══════════════════════════════════════════════════════
// MAIN RENDER DISPATCHER
// ══════════════════════════════════════════════════════
function render(){
  renderSidebar();
  var main=$('main');main.innerHTML='';
  if(currentTab==='products')renderProducts();
  else if(currentTab==='analytics')renderAnalytics();
  else if(currentTab==='history')renderHistory();
  else if(currentTab==='stock')renderStock();
  setTimeout(initMobileBanners,10);
}

// ══════════════════════════════════════════════════════
// PRODUCTS TAB
// ══════════════════════════════════════════════════════
function renderProducts(){
  var list=filteredProducts();
  var t=calcFor(list);
  var margin=t.rev>0?(t.profit/t.rev)*100:0;
  var isProfit=t.profit>=0;

  var f=selectedFolder?folderById(selectedFolder):null;
  $('page-title').textContent=f?f.name:'Каталог';
  $('page-sub').textContent=list.length+' товаров · Поиск: '+(searchQuery||'—');

  var main=$('main');

  // ── ИНСТРУКЦИЯ ──
  if(!localStorage.getItem('hide-tip-products')){
    var tip=document.createElement('div');tip.className='info-banner anim';
    tip.innerHTML='<div class="info-banner-icon">🏷️</div><div class="info-banner-body"><div class="info-banner-title">Вкладка «Каталог»</div><div class="info-banner-text">Здесь хранится каталог товаров. <b>Кол-во</b> — сколько единиц в обороте, автоматически растёт при поставках и уменьшается при продажах.<br><b>Остаток</b> — актуальный склад. <b>Расходы</b> — разовые затраты (доставка, упаковка). <b>Прибыль</b> = (Розница − Опт) × Кол-во − Расходы.<br>Кнопка <b>💸</b> — быстрая продажа прямо из каталога. Продажи и поставки фиксируй в <b>Истории</b>.</div></div><button class="info-banner-close" onclick="localStorage.setItem(\'hide-tip-products\',1);this.closest(\'.info-banner\').remove()">✕</button>';
    main.appendChild(tip);
  }

  // STAT CARDS
  var statsDiv=document.createElement('div');statsDiv.className='sg anim';
  statsDiv.innerHTML=
    '<div class="sc blue"><div class="sc-icon">💰</div><div class="sc-label">Выручка</div><div class="sc-val">₽'+fmt(t.rev)+'</div><div class="sc-sub">'+list.length+' позиций</div></div>'+
    '<div class="sc yellow"><div class="sc-icon">📦</div><div class="sc-label">Себестоимость</div><div class="sc-val">₽'+fmt(t.cost)+'</div><div class="sc-sub">Опт × кол-во</div></div>'+
    '<div class="sc purple"><div class="sc-icon">🧾</div><div class="sc-label">Расходы</div><div class="sc-val">₽'+fmt(t.exp)+'</div><div class="sc-sub">Доп. затраты</div></div>'+
    '<div class="sc '+(isProfit?'green-state':'red-state')+'"><div class="sc-icon">'+(isProfit?'📈':'📉')+'</div><div class="sc-label">'+(isProfit?'Прибыль':'Убыток')+'</div><div class="sc-val" style="color:'+(isProfit?'var(--green)':'var(--red)')+'">₽'+fmt(Math.abs(t.profit))+'</div><div class="sc-sub">Маржа: '+fmtP(margin)+'</div><div class="sc-badge">'+fmtP(margin)+'</div></div>';
  main.appendChild(statsDiv);

  // FORM
  var formDiv=document.createElement('div');formDiv.className='form-wrap anim';
  formDiv.innerHTML=
    '<div class="form-head"><div class="fh-dot" id="fdot"></div><div class="fh-title" id="ftitle">Добавить товар</div><div class="fh-sub">Enter — быстрое добавление</div></div>'+
    '<div class="form-body">'+
      '<div class="fg"><label class="fl">Название</label><input type="text" id="fn" placeholder="Название товара..."></div>'+
      '<div class="fg"><label class="fl">Артикул/код</label><input type="text" id="farticle" placeholder="SKU-001"></div>'+
      '<div class="fg"><label class="fl">Опт (₽)</label><input type="number" id="fw" min="0" step="0.01" placeholder="0.00"></div>'+
      '<div class="fg"><label class="fl">Розница (₽)</label><input type="number" id="fr" min="0" step="0.01" placeholder="0.00"></div>'+
      '<div class="fg"><label class="fl">Кол-во</label><input type="number" id="fq" min="1" step="1" placeholder="1"></div>'+
      '<div class="fg"><label class="fl">Расходы (₽)</label><input type="number" id="fe" min="0" step="0.01" placeholder="0.00"></div>'+
      '<div class="fg"><label class="fl">Папка</label><select id="fcat"><option value="">— Без папки —</option></select></div>'+
      '<div class="fbtns"><button class="btn btn-primary" id="badd" onclick="doAdd()">＋ Добавить</button><button class="btn btn-danger" id="bcan" style="display:none" onclick="doCancel()">Отмена</button></div>'+
    '</div>'+
    '<div style="padding:0 20px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="fg"><label class="fl">Заметка (необязательно)</label><textarea class="notes-area" id="fnotes" placeholder="Поставщик, ссылка, условия..."></textarea></div><div class="fg"><label class="fl">Изображение (URL/base64, необязательно)</label><textarea class="notes-area" id="fimage" placeholder="https://... или data:image/..."></textarea></div></div>';
  main.appendChild(formDiv);

  // Populate folders select
  var sel=formDiv.querySelector('#fcat');
  folders.forEach(function(f2){var o=document.createElement('option');o.value=f2.id;o.textContent=f2.name;sel.appendChild(o);});
  if(selectedFolder!==null&&!editId)sel.value=selectedFolder;

  // Bind enter keys
  ['fn','farticle','fw','fr','fq','fe'].forEach(function(id){
    var el=formDiv.querySelector('#'+id);
    if(el)el.addEventListener('keydown',function(e){if(e.key==='Enter')doAdd();});
  });

  // TOOLBAR
  var tb=document.createElement('div');tb.className='toolbar anim';
  tb.innerHTML=
    '<div class="search-wrap"><span class="search-icon">🔍</span><input type="text" id="search-input" placeholder="Поиск: название/папка/код..." value="'+esc(searchQuery)+'" style="padding-left:34px"></div>'+
    '<div class="sort-info">'+(sortCol?'Сортировка: '+sortCol+(sortDir==='asc'?' ↑':' ↓'):'Без сортировки')+'</div>'+
    (sortCol?'<button class="btn btn-ghost" style="font-size:11px;padding:7px 12px" onclick="clearSort()">✕ Сброс</button>':'');
  main.appendChild(tb);
  var si=tb.querySelector('#search-input');
  if(si)si.addEventListener('input',function(e){searchQuery=e.target.value;render();});

  // TABLE
  var tableDiv=document.createElement('div');tableDiv.className='tw anim';
  var sortCell=function(col,label){
    var isSorted=sortCol===col;
    var arrow=isSorted?(sortDir==='asc'?'↑':'↓'):'↕';
    return '<div class="thead-cell'+(isSorted?' sorted':'')+'" onclick="doSort(\''+col+'\')" title="Сортировать">'+label+' <span class="sort-arrow'+(isSorted?' on':'')+'">'+arrow+'</span></div>';
  };
  tableDiv.innerHTML='<div class="thead tgrid-p">'+
    '<div></div>'+
    sortCell('name','Товар')+
    '<div>Папка</div>'+
    sortCell('wholesale','Опт')+
    sortCell('retail','Розница')+
    sortCell('qty','Кол-во')+
    sortCell('expenses','Расходы')+

function renderTable(list,t){

  list.forEach(function(p,i){
    var pr=(p.retail-p.wholesale)*p.qty-p.expenses;

    var noteCell=p.notes?'<span class="note-chip" title="'+esc(p.notes)+'">📝 '+esc(p.notes)+'</span>':'<span style="color:var(--text3);font-size:11px">—</span>';
    var stockVal=p.stock||0;
    var stockColor=stockVal===0?'var(--red)':stockVal<=(p.minStock||5)?'var(--yellow)':'var(--green)';
    row.innerHTML=
      '<div class="rnum">'+(i+1)+'</div>'+
      '<div class="rname" title="'+esc(p.name)+'">'+esc(p.name)+(p.article?'<div style="font-size:10px;color:var(--text3)">#'+esc(p.article)+'</div>':'')+'</div>'+
      '<div>'+folderCell+'</div>'+
      '<div class="rcell">₽'+fmtD(p.wholesale)+'</div>'+
      '<div class="rcell">₽'+fmtD(p.retail)+'</div>'+
      '<div class="rcell">'+p.qty+' шт</div>'+
      '<div class="rcell">₽'+fmtD(p.expenses)+'</div>'+
      '<div class="pcell"><span style="color:'+pc+';font-weight:700">'+(pr>=0?'+':'−')+'₽'+fmtD(Math.abs(pr))+'</span><span class="mb '+(m>=0?'mb-p':'mb-n')+'">'+fmtP(m)+'</span></div>'+
      '<div style="font-weight:700;color:'+stockColor+';font-size:14px">'+stockVal+'<span style="font-size:10px;font-weight:400;color:var(--text3);margin-left:2px">шт</span></div>'+
      '<div>'+(p.image?'<img src="'+esc(p.image)+'" alt="" style="width:26px;height:26px;object-fit:cover;border-radius:6px;border:1px solid var(--border);vertical-align:middle;margin-right:4px">':'')+noteCell+'</div>'+

    tbody.appendChild(row);
  });
  $('tfoot').style.display='';
  $('ffrev').textContent='₽'+fmt(t.rev);
  $('ffexp').textContent='₽'+fmt(t.exp);

function saleInSelectedRange(s){
  var d=parseISO(s.date);if(!d)return false;
  var today=parseISO(isoToday());
  if(analyticsRange.mode==='today')return s.date===isoToday();
  if(analyticsRange.mode==='7d' || analyticsRange.mode==='30d'){
    var days=analyticsRange.mode==='7d'?7:30;
    var from=new Date(today);from.setDate(from.getDate()-(days-1));
    return d>=from&&d<=today;
  }
  var fromC=parseISO(analyticsRange.from),toC=parseISO(analyticsRange.to);
  if(!fromC||!toC)return true;
  if(fromC>toC){var tmp=fromC;fromC=toC;toC=tmp;}
  return d>=fromC&&d<=toC;
}
function rangeLabel(){
  if(analyticsRange.mode==='today')return 'Сегодня';
  if(analyticsRange.mode==='7d')return 'Последние 7 дней';
  if(analyticsRange.mode==='30d')return 'Последние 30 дней';
  return (analyticsRange.from||'...')+' → '+(analyticsRange.to||'...');
}

  var allT=calcFor(products);

  var potentialProfit=products.reduce(function(sum,p){return sum+((p.retail-p.wholesale)*(p.stock||0));},0);
  var actualProfit=salesRev?0:0;

  // ── PERIOD COMPARISON ──

  var avgProfit=filteredSales.length>0?Math.round(salesProfit/filteredSales.length*100)/100:0;

  function deltaTag(d){

  }

  // PERIOD STAT CARDS
  var periodCards=document.createElement('div');periodCards.className='sg anim';

    '<div class="sc blue"><div class="sc-icon">🛒</div><div class="sc-label">Продаж</div><div class="sc-val">'+filteredSales.length+'</div><div class="sc-sub">'+salesQty+' единиц товара</div></div>'+

    '<div class="sc orange"><div class="sc-icon">💎</div><div class="sc-label">Маржа</div><div class="sc-val" style="color:var(--orange)">'+(salesRev>0?Math.round(salesProfit/salesRev*100):0)+'%</div><div class="sc-sub">По продажам периода</div></div>';
  main.appendChild(periodCards);

  var finance=document.createElement('div');finance.className='sg anim';

  var custMap={},supMap={};

  var bestCustomer=Object.keys(custMap).sort(function(a,b){return custMap[b]-custMap[a];})[0]||'—';
  var bestSupplier=Object.keys(supMap).sort(function(a,b){return supMap[b]-supMap[a];})[0]||'—';
  var rel=document.createElement('div');rel.className='tw anim';

  if(analyticsPeriod==='month'){

  // ── SALES BY MONTH CHART (bar chart) ──
  if(analyticsPeriod==='year' || analyticsPeriod==='all'){
    var MONTHS_SHORT=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
    var year=analyticsPeriod==='year'?analyticsYear:analyticsYear;
    // collect monthly data for the selected year (or current year for 'all')
    var displayYear=analyticsPeriod==='year'?analyticsYear:new Date().getFullYear();
    var monthly=[];
    for(var m=0;m<12;m++){
      var ms=sales.filter(function(s){var d=new Date(s.date);return d.getFullYear()===displayYear&&d.getMonth()===m;});

    monthly.forEach(function(md,i){
      var x=i*(bw+gap)+30;
      var revH=Math.round(md.rev/maxVal*chartH);
      var proH=Math.round(Math.abs(md.profit)/maxVal*chartH);

function setPeriod(p){
  analyticsPeriod=p;
  analyticsYear=new Date().getFullYear();
  analyticsMonth=new Date().getMonth();
  render();
}
function shiftPeriod(dir){
  if(analyticsPeriod==='month'){
    analyticsMonth+=dir;
    if(analyticsMonth<0){analyticsMonth=11;analyticsYear--;}
    if(analyticsMonth>11){analyticsMonth=0;analyticsYear++;}
  } else if(analyticsPeriod==='year'){
    analyticsYear+=dir;
  }
  render();
}
function setDashboardRange(mode){
  analyticsRange.mode=mode;
  if(mode==='today'){analyticsRange.from=isoToday();analyticsRange.to=isoToday();}
  if(mode==='7d' || mode==='30d'){analyticsRange.from='';analyticsRange.to='';}
  render();
}
function setDashboardCustom(idx,val){
  analyticsRange.mode='custom';
  if(idx===0)analyticsRange.from=val;
  else analyticsRange.to=val;
  persist();
  render();
}

function buildDonut(parts){
  var r=60,cx=80,cy=80,stroke=18;
  var total=parts.reduce(function(s,p){return s+p.val;},0)||1;
  var svg='<svg viewBox="0 0 160 160" style="width:160px;height:160px;flex-shrink:0" xmlns="http://www.w3.org/2000/svg">';
  var offset=0;
  parts.forEach(function(p){
    if(p.val<=0)return;
    var pct=p.val/total;
    var start=offset*2*Math.PI-Math.PI/2;
    var end=(offset+pct)*2*Math.PI-Math.PI/2;
    var x1=cx+r*Math.cos(start),y1=cy+r*Math.sin(start);
    var x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);
    var large=pct>0.5?1:0;
    svg+='<path d="M'+cx+' '+cy+' L'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+p.color+'" opacity="0.8"/>';
    offset+=pct;
  });
  svg+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-stroke)+'" fill="var(--s1)"/>';
  svg+='</svg>';
  return svg;
}

function switchHistTab(tab){historyTab=tab;render();}
function resetHistoryFilters(){
  historyFilters={productId:'',folderId:'',from:'',to:'',type:'all',sort:'date_desc'};
  render();
}
function applyHistorySort(a,b,type){
  var mode=historyFilters.sort||'date_desc';
  var ad=a.date||'',bd=b.date||'';
  if(mode==='date_asc')return String(ad).localeCompare(String(bd));
  if(mode==='date_desc')return String(bd).localeCompare(String(ad));
  if(mode==='qty_desc')return (b.qty||0)-(a.qty||0);
  if(mode==='amount_desc')return ((b.qty||0)*(b.price||0))-((a.qty||0)*(a.price||0));
  if(mode==='profit_desc' && type==='sales'){
    return (b.profitAtSale||0)-(a.profitAtSale||0);
  }
  return (b.id||0)-(a.id||0);
}

function setDiscountType(type){
  discountType=type;
  persist();
  render();
}

function updateSalePreview(){
  var prev=$('sale-preview');if(!prev)return;
  var prodId=parseInt($('hs-prod')?$('hs-prod').value:0);
  var qty=parseInt($('hs-qty')?$('hs-qty').value:0);
  var p=productById(prodId);
  if(!p||isNaN(qty)||qty<1){prev.innerHTML='';return;}
  if(qty>(p.stock||0)){prev.innerHTML='<span style="color:var(--red)">Недостаточно остатка: доступно '+(p.stock||0)+' шт</span>';return;}
  var priceVal=parseFloat($('hs-price')?$('hs-price').value:'');
  var basePrice=isNaN(priceVal)?p.retail:priceVal;
  var discVal=parseFloat($('hs-disc')?$('hs-disc').value:'');
  var finalPrice=basePrice;
  var discStr='';
  if(!isNaN(discVal)&&discVal>0){
    if(discountType==='currency'){
      finalPrice=Math.max(0,Math.round((basePrice-discVal)*100)/100);
      discStr=' · скидка −₽'+fmtD(discVal);
    } else {
      if(discVal<=100){finalPrice=Math.round(basePrice*(1-discVal/100)*100)/100;discStr=' · скидка −'+discVal+'%';}
    }
  }
  var revenue=qty*finalPrice;
  var profit=qty*(finalPrice-(p.wholesale||0));
  var pc=profit>=0?'var(--green)':'var(--red)';
  prev.innerHTML='Итог: <b style="color:var(--text)">₽'+fmtD(revenue)+'</b> выручки'+discStr+' · прибыль <b style="color:'+pc+'">'+(profit>=0?'+':'−')+'₽'+fmtD(Math.abs(profit))+'</b> · остаток после продажи: '+Math.max(0,(p.stock||0)-qty)+' шт';
  var btn=$('sale-submit-btn');
  if(btn)btn.disabled=qty>(p.stock||0);
}

function addSale(){
  var prodId=parseInt($('hs-prod').value);
  var qty=parseInt($('hs-qty').value);
  var p=productById(prodId);
  if(!p||isNaN(qty)||qty<1){
    if(!p){var s=$('hs-prod');s.style.borderColor='var(--red)';setTimeout(function(){s.style.borderColor='';},1200);}
    if(isNaN(qty)){var q=$('hs-qty');q.style.borderColor='var(--red)';setTimeout(function(){q.style.borderColor='';},1200);}
    return;
  }
  if(qty>(p.stock||0)){alert('Недостаточно товара на складе. Доступно: '+(p.stock||0)+' шт.');return;}
  var priceVal=parseFloat($('hs-price').value);
  if(!isNaN(priceVal)&&priceVal<0){alert('Цена продажи не может быть отрицательной.');return;}
  var basePrice=isNaN(priceVal)?p.retail:priceVal;
  var discVal=parseFloat($('hs-disc')?$('hs-disc').value:0);
  var disc=0, finalPrice=basePrice;
  if(!isNaN(discVal)&&discVal>0){
    if(discountType==='currency'){
      finalPrice=Math.max(0,Math.round((basePrice-discVal)*100)/100);
      disc=basePrice>0?Math.round((discVal/basePrice)*10000)/100:0; // store as %
    } else {
      if(discVal<=100){disc=discVal;finalPrice=Math.round(basePrice*(1-disc/100)*100)/100;}
    }
  }
  if(finalPrice<0){alert('Итоговая цена продажи не может быть отрицательной.');return;}
  var date=$('hs-date')?$('hs-date').value:new Date().toISOString().slice(0,10);
  var note=$('hs-note')?$('hs-note').value.trim():'';
  var customer=$('hs-customer')?$('hs-customer').value.trim():'';
  var snapshot=computeSaleSnapshot(p,qty,basePrice,finalPrice,disc);
  sales.push({id:nextSaleId++,productId:prodId,qty:qty,price:finalPrice,discount:disc,date:date,note:note,customer:customer,costAtSale:snapshot.costAtSale,retailAtSale:snapshot.retailAtSale,discountAtSale:snapshot.discountAtSale,profitAtSale:snapshot.profitAtSale});
  p.stock=Math.max(0,(p.stock||0)-qty);
  persist();render();
}

function addPurchase(){
  var prodId=parseInt($('hp-prod').value);
  var qty=parseInt($('hp-qty').value);
  var p=productById(prodId);
  if(!p||isNaN(qty)||qty<1){
    if(!p){var s=$('hp-prod');s.style.borderColor='var(--red)';setTimeout(function(){s.style.borderColor='';},1200);}
    if(isNaN(qty)){var q=$('hp-qty');q.style.borderColor='var(--red)';setTimeout(function(){q.style.borderColor='';},1200);}
    return;
  }
  var priceVal=parseFloat($('hp-price').value);
  if(!isNaN(priceVal)&&priceVal<0){alert('Цена закупки не может быть отрицательной.');return;}
  var price=isNaN(priceVal)?p.wholesale:priceVal;
  var date=$('hp-date')?$('hp-date').value:new Date().toISOString().slice(0,10);
  var note=$('hp-note')?$('hp-note').value.trim():'';
  var supplier=$('hp-supplier')?$('hp-supplier').value.trim():'';
  purchases.push({id:nextPurchaseId++,productId:prodId,qty:qty,price:price,date:date,note:note,supplier:supplier});
  // Увеличиваем склад и общее кол-во
  p.stock=(p.stock||0)+qty;
  p.qty=(p.qty||0)+qty;
  // Обновляем оптовую цену если указана
  if(!isNaN(priceVal)) p.wholesale=price;
  persist();render();
}

function delSale(id){
  var s=null;for(var i=0;i<sales.length;i++)if(sales[i].id===id){s=sales[i];break;}
  if(!s)return;
  var p=productById(s.productId);
  if(p)p.stock=(p.stock||0)+s.qty;
  sales=sales.filter(function(x){return x.id!==id;});
  showUndo('Продажа удалена',function(){
    sales.push(s);
    var pp=productById(s.productId);if(pp)pp.stock=Math.max(0,(pp.stock||0)-s.qty);
  });
  persist();render();
}

function delPurchase(id){
  var pu=null;for(var i=0;i<purchases.length;i++)if(purchases[i].id===id){pu=purchases[i];break;}
  if(!pu)return;
  var p=productById(pu.productId);
  if(p){
    p.stock=Math.max(0,(p.stock||0)-pu.qty);
    p.qty=Math.max(0,(p.qty||0)-pu.qty);
  }
  purchases=purchases.filter(function(x){return x.id!==id;});
  showUndo('Поставка удалена',function(){
    purchases.push(pu);
    var pp=productById(pu.productId);if(pp){pp.stock=(pp.stock||0)+pu.qty;pp.qty=(pp.qty||0)+pu.qty;}
  });
  persist();render();
}

    card.appendChild(row);
  });
  main.appendChild(card);
}

// LIVE UPDATE — пересчёт без полного ре-рендера
// ══════════════════════════════════════════════════════
function liveUpdate(){
  // Сайдбар: выручка, расходы, прибыль
  var all=calcFor(products);
  var sbRev=$('sb-rev'),sbExp=$('sb-exp'),sbPro=$('sb-pro');
  if(sbRev)sbRev.textContent='₽'+fmt(all.rev);
  if(sbExp)sbExp.textContent='₽'+fmt(all.exp);
  if(sbPro){sbPro.textContent=(all.profit>=0?'+':'-')+'₽'+fmt(Math.abs(all.profit));sbPro.className=all.profit>=0?'g':'r';}
  var cntAll=$('cnt-all'),cntFAll=$('cnt-folder-all'),cntHist=$('cnt-hist');
  if(cntAll)cntAll.textContent=products.length;
  if(cntFAll)cntFAll.textContent=products.length;
  if(cntHist)cntHist.textContent=sales.length+purchases.length;

  // Карточки на вкладке Склад — обновляем не перерисовывая таблицу
  if(currentTab==='stock'){
    var soldMap={};
    sales.forEach(function(s){soldMap[s.productId]=(soldMap[s.productId]||0)+(s.qty||0);});
    products.forEach(function(p){
      var sold=soldMap[p.id]||0;
      var stock=p.stock||0;
      var min=p.minStock||5;
      var row=document.querySelector('[data-id="'+p.id+'"]');
      if(!row)return;
      // Обновляем числа и бар
      var total=sold+stock;
      var soldW=total>0?Math.round(sold/total*100):0;
      var leftW=100-soldW;
      var barColor=stock===0?'var(--red)':stock<=min?'var(--yellow)':'var(--green)';
      var badge=stock===0?'stock-out':stock<=min?'stock-low':'stock-ok';
      var badgeText=stock===0?'Нет':stock<=min?'Мало':'В норме';
      // Найти и обновить span остатка
      var spans=row.querySelectorAll('span[data-role]');
      spans.forEach(function(sp){
        if(sp.getAttribute('data-role')==='stock-num'){sp.textContent=stock;sp.style.color=barColor;}
        if(sp.getAttribute('data-role')==='sold-num'){sp.textContent=sold;}
      });
      var stockCol=row.querySelector('[data-role="stock-col"]');
      if(stockCol){stockCol.textContent=stock;stockCol.style.color=barColor;}
      // Бар
      var bars=row.querySelectorAll('[data-role="sold-bar"]');
      bars.forEach(function(b){b.style.width=soldW+'%';});
      var barRights=row.querySelectorAll('[data-role="left-bar"]');
      barRights.forEach(function(b){b.style.background=barColor;b.style.width=leftW+'%';});
      // Бейдж
      var bdg=row.querySelector('.stock-badge');
      if(bdg){bdg.className='stock-badge '+badge;bdg.textContent=badgeText;}
    });
  }

  // Карточки статистики на текущей вкладке
  if(currentTab==='products'){
    var list=filteredProducts();
    var t=calcFor(list);
    var margin=t.rev>0?(t.profit/t.rev)*100:0;
    var isProfit=t.profit>=0;
    var el;
    el=document.querySelector('.sc.blue .sc-val');if(el)el.textContent='₽'+fmt(t.rev);
    el=document.querySelector('.sc.yellow .sc-val');if(el)el.textContent='₽'+fmt(t.cost);
    el=document.querySelector('.sc.purple .sc-val');if(el)el.textContent='₽'+fmt(t.exp);
    var pCard=document.querySelector('.sc.green-state, .sc.red-state');
    if(pCard){
      pCard.className='sc '+(isProfit?'green-state':'red-state');
      var pVal=pCard.querySelector('.sc-val');if(pVal){pVal.textContent='₽'+fmt(Math.abs(t.profit));pVal.style.color=isProfit?'var(--green)':'var(--red)';}
      var pSub=pCard.querySelector('.sc-sub');if(pSub)pSub.textContent='Маржа: '+fmtP(margin);
      var pBdg=pCard.querySelector('.sc-badge');if(pBdg)pBdg.textContent=fmtP(margin);
    }
  }
}

// Дебаунс для частых инпутов
var _debounceTimers={};
function debounce(key,fn,ms){
  clearTimeout(_debounceTimers[key]);
  _debounceTimers[key]=setTimeout(fn,ms||400);
}
function showUndo(text,undoFn){
  lastDeletedAction={undo:undoFn,ts:Date.now()};
  var existing=$('undo-toast');if(existing)existing.remove();
  var toast=document.createElement('div');
  toast.id='undo-toast';
  toast.style.cssText='position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--s1);border:1px solid var(--border2);padding:10px 12px;border-radius:10px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 25px rgba(0,0,0,.35)';
  toast.innerHTML='<span style="font-size:12px">'+esc(text)+'</span><button class="btn btn-ghost" style="padding:6px 10px;font-size:11px" onclick="undoLastDelete()">Отменить</button>';
  document.body.appendChild(toast);
  setTimeout(function(){if(toast.parentNode)toast.remove();if(lastDeletedAction&&Date.now()-lastDeletedAction.ts>4800)lastDeletedAction=null;},5000);
}
function undoLastDelete(){
  if(!lastDeletedAction||!lastDeletedAction.undo)return;
  lastDeletedAction.undo();
  lastDeletedAction=null;
  var toast=$('undo-toast');if(toast)toast.remove();
  persist();render();
}

function doAdd(){
  var fn=$('fn'),fa=$('farticle'),fw=$('fw'),fr=$('fr'),fq=$('fq'),fe=$('fe'),fc=$('fcat'),fnotes=$('fnotes'),fimage=$('fimage');
  if(!fn||!fw||!fr||!fq)return;
  var name=fn.value.trim(),article=fa?fa.value.trim():'',img=fimage?fimage.value.trim():'',w=parseFloat(fw.value),r=parseFloat(fr.value),q=parseInt(fq.value),e=parseFloat(fe.value)||0,fid=fc&&fc.value?parseInt(fc.value):null,notes=fnotes?fnotes.value.trim():'';
  if(!name||isNaN(w)||isNaN(r)||isNaN(q)||q<1||w<0||r<0||e<0){
    var shake=function(el){if(!el)return;el.style.borderColor='var(--red)';el.style.boxShadow='0 0 0 3px rgba(255,61,107,0.1)';setTimeout(function(){el.style.borderColor='';el.style.boxShadow='';},1200);};
    if(!name)shake(fn);if(isNaN(w))shake(fw);if(isNaN(r))shake(fr);if(isNaN(q))shake(fq);
    return;
  }
  if(editId!==null){
    var ep=productById(editId);
    if(ep){
      // Если кол-во изменилось — пересчитываем остаток пропорционально
      // stock = новое_qty - уже_продано
      var sold=sales.filter(function(s){return s.productId===ep.id;}).reduce(function(sum,s){return sum+s.qty;},0);
      var newStock=Math.max(0, q - sold);
      Object.assign(ep,{name:name,article:article,image:img,wholesale:w,retail:r,qty:q,expenses:e,folderId:fid,notes:notes,stock:newStock});
    }
    editId=null;
  }else{
    products.push({id:nextId++,name:name,article:article,image:img,wholesale:w,retail:r,qty:q,expenses:e,folderId:fid,stock:q,minStock:5,notes:notes});
  }
  persist();render();
}

function doEdit(id){
  editId=id;
  if(currentTab!=='products')switchTab('products');
  else render();
}

function doDel(id){
  if(!confirm('Удалить товар?'))return;
  var removed=productById(id);
  var removedSales=sales.filter(function(s){return s.productId===id;});
  var removedPurchases=purchases.filter(function(pu){return pu.productId===id;});
  products=products.filter(function(p){return p.id!==id;});
  sales=sales.filter(function(s){return s.productId!==id;});
  purchases=purchases.filter(function(pu){return pu.productId!==id;});
  if(editId===id)editId=null;
  if(removed){
    showUndo('Товар удален: '+removed.name,function(){
      products.push(removed);
      removedSales.forEach(function(s){sales.push(s);});
      removedPurchases.forEach(function(pu){purchases.push(pu);});
    });
  }
  persist();render();
}

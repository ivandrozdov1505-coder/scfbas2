// CUSTOM CALENDAR
// ══════════════════════════════════════════════════════
var CAL = {
  isOpen: false,
  year: new Date().getFullYear(),
  month: new Date().getMonth(),
  selected: new Date().toISOString().slice(0,10),
  inited: false,
  MONTHS: ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
  WD: ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'],

  fmt: function(iso){
    if(!iso) return 'Выберите дату';
    var p=iso.split('-'); return p[2]+'.'+p[1]+'.'+p[0];
  },

  draw: function(){
    var lbl=document.getElementById('cal-month-label');
    if(lbl) lbl.textContent=CAL.MONTHS[CAL.month]+' '+CAL.year;
    var wd=document.getElementById('cal-weekdays');
    if(wd && wd.children.length===0){
      CAL.WD.forEach(function(w){var d=document.createElement('div');d.className='cal-wd';d.textContent=w;wd.appendChild(d);});
    }
    var daysEl=document.getElementById('cal-days');
    if(!daysEl) return;
    daysEl.innerHTML='';
    var today=new Date().toISOString().slice(0,10);
    var firstWd=new Date(CAL.year, CAL.month, 1).getDay();
    var offset=(firstWd+6)%7;
    var total=new Date(CAL.year, CAL.month+1, 0).getDate();
    for(var i=0;i<offset;i++){
      var e=document.createElement('div');e.className='cal-day empty';daysEl.appendChild(e);
    }
    for(var d=1;d<=total;d++){
      var iso=CAL.year+'-'+String(CAL.month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      var el=document.createElement('div');
      el.className='cal-day'+(iso===today?' today':'')+(iso===CAL.selected?' selected':'');
      el.textContent=d;
      el.setAttribute('data-iso', iso);
      daysEl.appendChild(el);
    }
  },

  open: function(){
    var pop=document.getElementById('cal-popup-el');
    var trig=document.getElementById('cal-trigger');
    if(!pop||!trig) return;
    if(CAL.selected){var d=new Date(CAL.selected);CAL.year=d.getFullYear();CAL.month=d.getMonth();}
    CAL.draw();
    var r=trig.getBoundingClientRect();
    var top=r.bottom+6, left=r.left;
    if(top+360>window.innerHeight) top=Math.max(6, r.top-366);
    if(left+300>window.innerWidth) left=Math.max(6, window.innerWidth-306);
    pop.style.top=top+'px';
    pop.style.left=left+'px';
    pop.classList.add('open');
    trig.classList.add('open');
    CAL.isOpen=true;
  },

  close: function(){
    var pop=document.getElementById('cal-popup-el');
    var trig=document.getElementById('cal-trigger');
    if(pop) pop.classList.remove('open');
    if(trig) trig.classList.remove('open');
    CAL.isOpen=false;
  },

  toggle: function(){
    if(CAL.isOpen) CAL.close(); else CAL.open();
  },

  select: function(iso){
    CAL.selected=iso;
    var disp=document.getElementById('cal-display');
    if(disp) disp.textContent=CAL.fmt(iso);
    CAL.close();
  },

  prevMonth: function(){ CAL.month--; if(CAL.month<0){CAL.month=11;CAL.year--;} CAL.draw(); },
  nextMonth: function(){ CAL.month++; if(CAL.month>11){CAL.month=0;CAL.year++;} CAL.draw(); },
  prevYear:  function(){ CAL.year--; CAL.draw(); },
  nextYear:  function(){ CAL.year++; CAL.draw(); },
  goToday:   function(){ var d=new Date();CAL.year=d.getFullYear();CAL.month=d.getMonth();CAL.draw(); },
  pickToday: function(){ CAL.select(new Date().toISOString().slice(0,10)); },

  init: function(){
    if(CAL.inited) return;
    var pop=document.getElementById('cal-popup-el');
    if(!pop) return;
    CAL.inited=true;
    // Block bubbling so outside-click handler never fires from inside popup
    pop.addEventListener('click', function(e){ e.stopPropagation(); });
    document.getElementById('cal-py').addEventListener('click', CAL.prevYear);
    document.getElementById('cal-ny').addEventListener('click', CAL.nextYear);
    document.getElementById('cal-pm').addEventListener('click', CAL.prevMonth);
    document.getElementById('cal-nm').addEventListener('click', CAL.nextMonth);
    document.getElementById('cal-clear-btn').addEventListener('click', CAL.goToday);
    document.getElementById('cal-pick-today').addEventListener('click', CAL.pickToday);
    document.getElementById('cal-days').addEventListener('click', function(e){
      var iso=e.target.getAttribute('data-iso');
      if(iso) CAL.select(iso);
    });
    document.addEventListener('click', function(e){
      if(!CAL.isOpen) return;
      var trig=document.getElementById('cal-trigger');
      if(trig && trig.contains(e.target)) return;
      CAL.close();
    });
  }
};

function doExportExcel(){
  // SpreadsheetML 2003 — стабильно открывается в Excel без сторонних библиотек
  function xmlStr(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function round2(v){return Math.round((Number(v)||0)*100)/100;}
  function toDisplayDate(v){
    var s=String(v||'');
    var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    return m?(m[3]+'.'+m[2]+'.'+m[1]):s;
  }
  function sheetName(v){
    var s=String(v||'Лист').replace(/[\\\/\?\*\[\]\:]/g,' ').trim();
    if(!s)s='Лист';
    return s.slice(0,31);
  }
  function row(cells,isHeader){
    return '<Row>'+cells.map(function(c){
      var t=typeof c==='number'&&isFinite(c)?'Number':'String';
      return '<Cell'+(isHeader?' ss:StyleID="h"':'')+'><Data ss:Type="'+t+'">'+xmlStr(c)+'</Data></Cell>';
    }).join('')+'</Row>';
  }
  function sheet(name,rows,colCount){
    return '<Worksheet ss:Name="'+xmlStr(sheetName(name))+'"><Table ss:ExpandedColumnCount="'+colCount+'" ss:ExpandedRowCount="'+rows.length+'" x:FullColumns="1" x:FullRows="1">'+rows.join('')+'</Table>'+
      '<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><Panes><Pane><Number>3</Number></Pane></Panes>'+
      '<ProtectObjects>False</ProtectObjects><ProtectScenarios>False</ProtectScenarios></WorksheetOptions></Worksheet>';
  }

  // Sheet 1: Товары
  var pRows=[row(['#','Название','Папка','Опт (₽)','Розница (₽)','Кол-во','Расходы (₽)','Остаток','Прибыль (₽)','Маржа (%)','Заметка'],true)];
  var pTotalQty=0,pTotalExp=0,pTotalProfit=0;
  products.forEach(function(p,i){
    var f=p.folderId?folderById(p.folderId):null;
    var profit=(p.retail-p.wholesale)*p.qty-p.expenses;
    var margin=p.retail*p.qty>0?Math.round(profit/(p.retail*p.qty)*1000)/10:0;
    pRows.push(row([i+1,p.name,f?f.name:'',round2(p.wholesale),round2(p.retail),round2(p.qty),round2(p.expenses),round2(p.stock||0),round2(profit),round2(margin),p.notes||'']));
    pTotalQty+=Number(p.qty)||0;
    pTotalExp+=Number(p.expenses)||0;
    pTotalProfit+=Number(profit)||0;
  });
  pRows.push(row(['','ИТОГО','','','',round2(pTotalQty),round2(pTotalExp),'',round2(pTotalProfit),'','']));

  // Sheet 2: Продажи
  var sRows=[row(['#','Дата','Товар','Кол-во','Цена продажи (₽)','Скидка (%)','Выручка (₽)','Прибыль (₽)'],true)];
  var sTotalQty=0,sTotalRev=0,sTotalProfit=0;
  sales.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));}).forEach(function(s,i){
    var p=productById(s.productId);if(!p)return;
    var revenue=s.qty*s.price;
    var profit=s.qty*(s.price-p.wholesale);
    sRows.push(row([i+1,toDisplayDate(s.date),p.name,round2(s.qty),round2(s.price),round2(s.discount||0),round2(revenue),round2(profit)]));
    sTotalQty+=Number(s.qty)||0;
    sTotalRev+=Number(revenue)||0;
    sTotalProfit+=Number(profit)||0;
  });
  sRows.push(row(['','ИТОГО','',round2(sTotalQty),'','',round2(sTotalRev),round2(sTotalProfit)]));

  // Sheet 3: Поставки
  var puRows=[row(['#','Дата','Товар','Кол-во','Цена закупки (₽)','Сумма (₽)'],true)];
  var puTotalQty=0,puTotalSum=0;
  purchases.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));}).forEach(function(pu,i){
    var p=productById(pu.productId);if(!p)return;
    var total=pu.qty*pu.price;
    puRows.push(row([i+1,toDisplayDate(pu.date),p.name,round2(pu.qty),round2(pu.price),round2(total)]));
    puTotalQty+=Number(pu.qty)||0;
    puTotalSum+=Number(total)||0;
  });
  puRows.push(row(['','ИТОГО','',round2(puTotalQty),'',round2(puTotalSum)]));

  // Sheet 4: Склад
  var stRows=[row(['#','Товар','Папка','Куплено','Продано','Остаток','Порог «мало»','Статус'],true)];
  products.forEach(function(p,i){
    var f=p.folderId?folderById(p.folderId):null;
    var sold=sales.filter(function(s){return s.productId===p.id;}).reduce(function(sum,s){return sum+s.qty;},0);
    var stock=p.stock||0;var min=p.minStock||5;
    var status=stock===0?'Нет':'В норме';
    if(stock>0&&stock<=min)status='Мало';
    stRows.push(row([i+1,p.name,f?f.name:'',round2(p.qty),round2(sold),round2(stock),round2(min),status]));
  });

  var xml='<?xml version="1.0" encoding="UTF-8"?>'+
    '<?mso-application progid="Excel.Sheet"?>'+
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
    '<Styles><Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Bottom"/></Style><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles>'+
    sheet('Товары',pRows,11)+sheet('Продажи',sRows,8)+sheet('Поставки',puRows,6)+sheet('Склад',stRows,8)+
    '</Workbook>';
  var blob=new Blob(['\uFEFF',xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='profit_'+new Date().toISOString().slice(0,10)+'.xls';a.click();URL.revokeObjectURL(url);
}
function doExportCSV(kind){
  function csvEscape(v){var s=String(v==null?'':v);return /[\",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
  var rows=[];
  if(kind==='sales'){
    rows.push(['date','product','qty','price','revenue','profit','customer','note']);
    sales.forEach(function(s){var p=productById(s.productId);if(!p)return;rows.push([s.date,p.name,s.qty,s.price,s.qty*s.price,s.profitAtSale||0,s.customer||'',s.note||'']);});
  }else if(kind==='purchases'){
    rows.push(['date','product','qty','price','sum','supplier','note']);
    purchases.forEach(function(pu){var p=productById(pu.productId);if(!p)return;rows.push([pu.date,p.name,pu.qty,pu.price,pu.qty*pu.price,pu.supplier||'',pu.note||'']);});
  }else{
    rows.push(['product','folder','stock','minStock','wholesale','retail','stockValueWholesale','stockValueRetail']);
    products.forEach(function(p){var f=p.folderId?folderById(p.folderId):null;rows.push([p.name,f?f.name:'',p.stock||0,p.minStock||0,p.wholesale||0,p.retail||0,(p.stock||0)*(p.wholesale||0),(p.stock||0)*(p.retail||0)]);});
  }
  var csv=rows.map(function(r){return r.map(csvEscape).join(';');}).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);var a=document.createElement('a');
  a.href=url;a.download='profit_'+kind+'_'+isoToday()+'.csv';a.click();URL.revokeObjectURL(url);
}

$('imp').addEventListener('change',function(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(Array.isArray(d)){products=d;folders=[];sales=[];purchases=[];nextId=d.length+1;nextFolderId=1;nextSaleId=1;nextPurchaseId=1;}
      else{products=d.products||[];folders=d.folders||[];sales=d.sales||[];purchases=d.purchases||[];nextId=d.nextId||products.length+1;nextFolderId=d.nextFolderId||folders.length+1;nextSaleId=d.nextSaleId||sales.length+1;nextPurchaseId=d.nextPurchaseId||purchases.length+1;}
      migrateData();
      editId=null;selectedFolder=null;persist();render();
    }catch(err){alert('Ошибка: '+err.message);}
  };
  reader.readAsText(file);this.value='';
});

// ══════════════════════════════════════════════════════
// BACKUP SYSTEM
// ══════════════════════════════════════════════════════
var BACKUP_KEY='ptv5_backups';
var MAX_BACKUPS=10;
var AUTO_BACKUP_INTERVAL=2*60*60*1000; // 2 hours
var LAST_AUTO_KEY='ptv5_last_auto_backup';

function getBackupData(){
  return JSON.stringify({products:products,folders:folders,sales:sales,purchases:purchases,nextId:nextId,nextFolderId:nextFolderId,nextSaleId:nextSaleId,nextPurchaseId:nextPurchaseId,theme:currentTheme,discountType:discountType,analyticsRange:analyticsRange});
}

function loadBackups(){
  try{return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');}catch(e){return[];}
}

function saveBackups(bk){
  try{localStorage.setItem(BACKUP_KEY,JSON.stringify(bk));}catch(e){}
}

function createBackup(type){
  var bk=loadBackups();
  var now=new Date();
  var entry={
    ts:now.getTime(),
    label:now.toLocaleString('ru-RU'),
    type:type, // 'auto' | 'manual'
    products:products.length,
    sales:sales.length,
    data:getBackupData()
  };
  bk.unshift(entry);
  if(bk.length>MAX_BACKUPS)bk=bk.slice(0,MAX_BACKUPS);
  saveBackups(bk);
  if(type==='manual'){
    var f=$('flash');if(f){f.textContent='✓ Копия создана';f.classList.add('on');setTimeout(function(){f.classList.remove('on');f.textContent='✓ Сохранено';},2000);}
  }
}

function createManualBackup(){
  createBackup('manual');
  renderBackupList();
}

function tryAutoBackup(){
  var last=parseInt(localStorage.getItem(LAST_AUTO_KEY)||'0');
  var now=Date.now();
  if(now-last>=AUTO_BACKUP_INTERVAL){
    createBackup('auto');
    localStorage.setItem(LAST_AUTO_KEY,String(now));
  }
}

function restoreBackup(ts){
  var bk=loadBackups();
  var entry=null;
  for(var i=0;i<bk.length;i++)if(bk[i].ts===ts){entry=bk[i];break;}
  if(!entry)return;
  if(!confirm('Восстановить копию от '+entry.label+'?\n\nТекущие данные будут перезаписаны.'))return;
  try{
    var d=JSON.parse(entry.data);
    products=d.products||[];folders=d.folders||[];sales=d.sales||[];purchases=d.purchases||[];
    nextId=d.nextId||products.length+1;nextFolderId=d.nextFolderId||folders.length+1;
    nextSaleId=d.nextSaleId||sales.length+1;nextPurchaseId=d.nextPurchaseId||purchases.length+1;
    if(d.theme)currentTheme=d.theme;if(d.discountType)discountType=d.discountType;if(d.analyticsRange)analyticsRange=d.analyticsRange;
    migrateData();
    persist();applyTheme();render();
    closeBackupModal();
    var f=$('flash');if(f){f.textContent='✓ Восстановлено';f.classList.add('on');setTimeout(function(){f.classList.remove('on');f.textContent='✓ Сохранено';},2500);}
  }catch(e){alert('Ошибка восстановления: '+e.message);}
}

function deleteBackup(ts){
  var bk=loadBackups();
  bk=bk.filter(function(b){return b.ts!==ts;});
  saveBackups(bk);
  renderBackupList();
}

function exportBackup(ts){
  var bk=loadBackups();
  var entry=null;
  for(var i=0;i<bk.length;i++)if(bk[i].ts===ts){entry=bk[i];break;}
  if(!entry)return;
  var blob=new Blob([entry.data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date(ts);
  a.href=url;a.download='backup_'+d.toISOString().slice(0,10)+'_'+d.getHours()+'h.json';
  a.click();URL.revokeObjectURL(url);
}

function renderBackupList(){
  var el=$('backup-list');if(!el)return;
  var bk=loadBackups();
  if(bk.length===0){el.innerHTML='<div style="text-align:center;padding:24px;color:var(--text3);font-size:13px">Копий пока нет</div>';return;}
  el.innerHTML='';
  bk.forEach(function(b){
    var item=document.createElement('div');item.className='backup-item';
    item.innerHTML=
      '<div class="backup-item-info">'+
        '<div class="backup-item-date">'+b.label+'</div>'+
        '<div class="backup-item-meta">'+b.products+' товаров · '+b.sales+' продаж</div>'+
      '</div>'+
      '<span class="'+(b.type==='auto'?'backup-auto-badge':'backup-manual-badge')+'">'+(b.type==='auto'?'Авто':'Ручная')+'</span>'+
      '<button onclick="exportBackup('+b.ts+')" title="Скачать" style="background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:4px 6px;border-radius:6px" onmouseover="this.style.color=\'var(--blue)\'" onmouseout="this.style.color=\'var(--text3)\'">⬇</button>'+
      '<button onclick="restoreBackup('+b.ts+')" title="Восстановить" style="background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:4px 6px;border-radius:6px" onmouseover="this.style.color=\'var(--green)\'" onmouseout="this.style.color=\'var(--text3)\'">↩</button>'+
      '<button onclick="deleteBackup('+b.ts+')" title="Удалить" style="background:transparent;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:4px 6px;border-radius:6px" onmouseover="this.style.color=\'var(--red)\'" onmouseout="this.style.color=\'var(--text3)\'">✕</button>';
    el.appendChild(item);
  });
}

function openBackupModal(){
  renderBackupList();
  $('backup-modal').classList.add('show');
}
function closeBackupModal(){$('backup-modal').classList.remove('show');}
$('backup-modal').addEventListener('click',function(e){if(e.target===$('backup-modal'))closeBackupModal();});

// Auto-backup on persist (throttled to interval)
var _origPersist=persist;
persist=function(){
  _origPersist();
  tryAutoBackup();
};

// Mobile: make info banners tap-to-expand
function initMobileBanners(){
  if(window.innerWidth>768)return;
  document.querySelectorAll('.info-banner').forEach(function(b){
    if(b._mobBound)return;
    b._mobBound=true;
    b.addEventListener('click',function(e){
      if(e.target.classList.contains('info-banner-close'))return;
      b.classList.toggle('mob-expanded');
    });
  });
}
